<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Feature extraction turns raw mass spectrometry scans into an aligned feature table</title>
<desc id="desc">Five schematic stages show raw scans, mass detection, chromatogram building, peak resolving, and alignment. Decisions at each stage affect the resulting sample-by-feature table, which can support statistics, molecular networking, and isolation but is not a list of confirmed compounds.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#5E3A52"/></marker></defs>
<text x="35" y="43" font-family="Newsreader, Georgia, serif" font-size="26" fill="#3D2036" text-anchor="start" font-weight="600">Feature extraction: the table is built by analytical decisions</text>
<text x="35" y="72" font-family="'DM Mono', ui-monospace, monospace" font-size="13" fill="#8C6D1F" text-anchor="start" font-weight="700">RAW DATA → FEATURES → HYPOTHESES; NOT RAW DATA → CONFIRMED COMPOUNDS</text>
<rect x="28" y="105" width="196" height="210" rx="14" fill="#FDFCF9" stroke="#5E3A52" stroke-width="1.5"/>
<text x="126" y="137" font-family="Newsreader, Georgia, serif" font-size="18" fill="#3D2036" text-anchor="middle" font-weight="600">1  Raw scans</text>
<text x="126" y="160" font-family="'DM Mono', ui-monospace, monospace" font-size="12" fill="#5E3A52" text-anchor="middle" font-weight="400">m/z × RT × intensity</text>
<rect x="266" y="105" width="196" height="210" rx="14" fill="#FDFCF9" stroke="#5E3A52" stroke-width="1.5"/>
<text x="364" y="137" font-family="Newsreader, Georgia, serif" font-size="18" fill="#3D2036" text-anchor="middle" font-weight="600">2  Mass detection</text>
<text x="364" y="160" font-family="'DM Mono', ui-monospace, monospace" font-size="12" fill="#5E3A52" text-anchor="middle" font-weight="400">signal versus noise</text>
<rect x="504" y="105" width="196" height="210" rx="14" fill="#FDFCF9" stroke="#5E3A52" stroke-width="1.5"/>
<text x="602" y="137" font-family="Newsreader, Georgia, serif" font-size="18" fill="#3D2036" text-anchor="middle" font-weight="600">3  Chromatograms</text>
<text x="602" y="160" font-family="'DM Mono', ui-monospace, monospace" font-size="12" fill="#5E3A52" text-anchor="middle" font-weight="400">one trace per m/z</text>
<rect x="742" y="105" width="196" height="210" rx="14" fill="#FDFCF9" stroke="#5E3A52" stroke-width="1.5"/>
<text x="840" y="137" font-family="Newsreader, Georgia, serif" font-size="18" fill="#3D2036" text-anchor="middle" font-weight="600">4  Resolve peaks</text>
<text x="840" y="160" font-family="'DM Mono', ui-monospace, monospace" font-size="12" fill="#5E3A52" text-anchor="middle" font-weight="400">separate coelution</text>
<rect x="980" y="105" width="196" height="210" rx="14" fill="#FDFCF9" stroke="#5E3A52" stroke-width="1.5"/>
<text x="1078" y="137" font-family="Newsreader, Georgia, serif" font-size="18" fill="#3D2036" text-anchor="middle" font-weight="600">5  Align features</text>
<text x="1078" y="160" font-family="'DM Mono', ui-monospace, monospace" font-size="12" fill="#5E3A52" text-anchor="middle" font-weight="400">match across samples</text>
