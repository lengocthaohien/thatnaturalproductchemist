<text x="35" y="417" font-family="'DM Mono', ui-monospace, monospace" font-size="13" fill="#8C6D1F" text-anchor="start" font-weight="700">AN ALIGNED FEATURE TABLE CAN PRIORITIZE THREE DIFFERENT TASKS</text>
