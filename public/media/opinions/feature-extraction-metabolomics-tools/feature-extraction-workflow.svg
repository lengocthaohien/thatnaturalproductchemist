<text x="600" y="575" font-family="Newsreader, Georgia, serif" font-size="17" fill="#5E3A52" text-anchor="middle" font-weight="600">Every downstream result inherits the feature-detection and alignment choices.</text>
<text x="35" y="606" font-family="'DM Mono', ui-monospace, monospace" font-size="12" fill="#5E3A52" text-anchor="start" font-weight="400">Conceptual schematic · EIC = extracted-ion chromatogram · S1–S3 = samples · No experimental values are implied</text>
</svg>
