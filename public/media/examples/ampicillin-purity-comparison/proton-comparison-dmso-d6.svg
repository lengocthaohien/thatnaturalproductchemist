<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" role="img" aria-labelledby="t d">
  <title id="t">Stacked 1H NMR comparison of two commercial ampicillin products in DMSO-d6</title>
  <desc id="d">Two stacked proton NMR spectra. The lower trace (Product B, sodium salt) is clean: an aromatic multiplet near 7.3 to 7.5 ppm, singlets near 5.5 and 4.4 ppm, and two methyl singlets near 1.46 and 1.48 ppm. The upper trace (Product A) shows additional split resonances around 6.8 to 7.0 ppm and several extra small peaks, indicating lower purity. Chemical shift axis runs from 8 ppm on the left to 0 ppm on the right.</desc>
