    .frame{fill:#E7DCC0}
    .axis{stroke:#3D2036;stroke-width:1;fill:none}
    .tick{stroke:#3D2036;stroke-width:1}
    .lbl{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:16px;fill:#3D2036;text-anchor:middle}
    .axis-title{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;fill:#5E3A52;text-anchor:middle;letter-spacing:1px}
    .trace{fill:none;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
    .blue{stroke:#2F4BA0}
    .red{stroke:#B0341F}
    .tag{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:16px;fill:#3D2036;text-anchor:end}
    .tag-strong{font-weight:600}
    .purity{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13.5px;fill:#5E3A52;text-anchor:end}
  </style>
  <rect class="frame" width="1080" height="620"/>

  <line class="axis" x1="40" y1="250" x2="1040" y2="250"/>
  <line class="axis" x1="40" y1="540" x2="1040" y2="540"/>

