name: Announce new publications

# Creates a GitHub Release for each newly published entry so watchers
# (Watch → Custom → Releases) are emailed by GitHub. See
# scripts/announce-publications.mjs.

on:
  push:
    branches: [main]
    paths:
      - 'src/content/articles/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Create releases for new publications
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/announce-publications.mjs
